name: Baseline benchmark
on:
  workflow_dispatch:
    inputs:
      rafter_ref:
        description: 'Rafter branch, tag, or full SHA (blank uses checked-in pin)'
        type: string
        default: ''
      rafter_hard_state:
        description: 'Candidate Rafter durable backend (journal/wal require matching revision support)'
        type: choice
        options: [replace, journal, wal]
        default: replace
        required: true
      suite:
        description: Benchmark suite
        type: choice
        options: [both, durable, microbench, rafter-only]
        default: both
        required: true
      prior_hard_state:
        description: Prior Rafter durable backend for paired comparisons
        type: choice
        options: [replace, journal, wal]
        default: journal
      prior_rafter_ref:
        description: Prior Rafter branch or commit; nonempty enables paired durable comparison
        type: string
        default: ''
      prior_mode:
        description: Prior Rafter embedding
        type: choice
        options: [inline, worker, messages, pipeline]
        default: inline
      candidate_mode:
        description: Candidate Rafter embedding
        type: choice
        options: [inline, worker, messages, pipeline]
        default: inline
      prior_peer_batch_size:
        description: Prior Rafter peer batch cap
        type: number
        default: 1
      peer_batch_sizes:
        description: Candidate peer batch caps, comma separated
        type: string
        default: 8,16,32,64
      scenario:
        description: Durable workload scenario
        type: choice
        options: [durable-kv, leader-loss, follower-catchup]
        default: durable-kv
        required: true
permissions:
  contents: read
concurrency:
  group: baseline-benchmark
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  RUST_BACKTRACE: '1'
  GOTOOLCHAIN: local
jobs:
  baseline:
    name: Selected Rafter baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler build-essential iproute2 iputils-ping
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Select Rafter revision
        id: select
        env:
          RAFTER_REF: ${{ inputs.rafter_ref }}
          RAFTER_HARD_STATE: ${{ inputs.rafter_hard_state }}
          SUITE: ${{ inputs.suite }}
          SCENARIO: ${{ inputs.scenario }}
          PRIOR_REF: ${{ inputs.prior_rafter_ref }}
          PRIOR_HARD_STATE: ${{ inputs.prior_hard_state }}
          PRIOR_MODE: ${{ inputs.prior_mode }}
          CANDIDATE_MODE: ${{ inputs.candidate_mode }}
          PRIOR_BATCH: ${{ inputs.prior_peer_batch_size }}
          CANDIDATE_BATCHES: ${{ inputs.peer_batch_sizes }}
        run: |
          mkdir -p results
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('results/request.json').write_text(json.dumps({key: os.environ[key] for key in ('RAFTER_REF', 'RAFTER_HARD_STATE', 'SUITE', 'SCENARIO', 'PRIOR_REF', 'PRIOR_HARD_STATE', 'PRIOR_MODE', 'CANDIDATE_MODE', 'PRIOR_BATCH', 'CANDIDATE_BATCHES', 'GITHUB_SHA')}, indent=2))
          PY
          if [[ -n "$RAFTER_REF" ]]; then
            ./raft-bench select-rafter "$RAFTER_REF" 2>&1 | tee results/selection.log
          fi
          cp implementations.lock.json results/implementations.lock.json
          python3 - <<'PY'
          import json, os
          with open('implementations.lock.json') as stream:
              pin = json.load(stream)['rafter']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"revision={pin['rev']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"Rafter: `{pin['rev']}`\n\nSuite: {os.environ['SUITE']}\n\nRafter hard state: {os.environ['RAFTER_HARD_STATE']}\n\nShared GitHub runner; compare all engines in the same run.\n")
          PY
      - name: In-memory benchmarks
        if: inputs.suite != 'durable' && inputs.prior_rafter_ref == ''
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          mode=full
          if [[ "$SUITE" == rafter-only ]]; then mode=rafter-only; fi
          ./raft-bench microbench --mode "$mode" --runs 3 --output results/microbench
          ./raft-bench verify results/microbench
      - name: Locked durable build and tests
        id: durable_build
        if: ${{ !cancelled() && (inputs.suite == 'both' || inputs.suite == 'durable') && steps.select.outcome == 'success' && inputs.prior_rafter_ref == '' }}
        env:
          RAFTER_HARD_STATE: ${{ inputs.rafter_hard_state }}
        run: ./raft-bench build --rafter-hard-state "$RAFTER_HARD_STATE" 2>&1 | tee results/baseline-build.log
      - name: Run 27 durable cases
        if: ${{ !cancelled() && steps.durable_build.outcome == 'success' }}
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          ./raft-bench run --implementations rafter,raft-rs,openraft \
            --scenario "$SCENARIO" --rates 0,100,1000 \
            --duration 60 --warmup 10 --runs 3 \
            --concurrency 64 --payload 512 \
            --data-root "$RUNNER_TEMP/raft-bench-data" \
            --output results/baseline 2>&1 | tee results/baseline-run.log
      - name: Paired durable comparison and batch sweep
        if: ${{ !cancelled() && inputs.prior_rafter_ref != '' && steps.select.outcome == 'success' }}
        env:
          PRIOR_REF: ${{ inputs.prior_rafter_ref }}
          CANDIDATE_REF: ${{ steps.select.outputs.revision }}
          PRIOR_HARD_STATE: ${{ inputs.prior_hard_state }}
          CANDIDATE_HARD_STATE: ${{ inputs.rafter_hard_state }}
          PRIOR_MODE: ${{ inputs.prior_mode }}
          CANDIDATE_MODE: ${{ inputs.candidate_mode }}
          PRIOR_BATCH: ${{ inputs.prior_peer_batch_size }}
          CANDIDATE_BATCHES: ${{ inputs.peer_batch_sizes }}
        run: |
          flags=()
          if [[ "$PRIOR_MODE" == messages || "$PRIOR_MODE" == pipeline || "$CANDIDATE_MODE" == messages || "$CANDIDATE_MODE" == pipeline ]]; then flags+=(--network-delays-ms "0,2"); fi
          python3 -m benchctl.paired --prior "$PRIOR_REF" --candidate "$CANDIDATE_REF" --prior-hard-state "$PRIOR_HARD_STATE" --candidate-hard-state "$CANDIDATE_HARD_STATE" "${flags[@]}" \
            --prior-mode "$PRIOR_MODE" --candidate-mode "$CANDIDATE_MODE" \
            --prior-peer-batch-size "$PRIOR_BATCH" --peer-batch-sizes "$CANDIDATE_BATCHES" \
            --output results/paired --data-root "$RUNNER_TEMP/raft-bench-paired" \
            2>&1 | tee results/paired.log
      - name: Retain reports and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ github.run_id }}
          path: |
            Cargo.lock
            microbench/Cargo.lock
            dist/build.json
            dist/rust-tests.log
            results/
          if-no-files-found: error
          retention-days: 30
