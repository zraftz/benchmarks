[workspace]
resolver = "2"
members = ["crates/common", "adapters/rafter", "adapters/raft-rs", "adapters/openraft"]
exclude = ["microbench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "=1.0.98"
async-trait = "=0.1.88"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
fs2 = "=0.4.3"
bench-common = { path = "crates/common" }

[profile.release]
debug = 1
lto = "thin"
